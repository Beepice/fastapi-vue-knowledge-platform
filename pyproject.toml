[project]
name = "knowledge-platform"
version = "0.0.0"
description = "DFT Knowledge Platform - A document repository built with FastAPI, Vue, and PostgreSQL"
authors = [
    {name = "Nik Sidnev", email = "sidnev.nick@gmail.com"},
    {name = "icekull", email = "850951338@qq.com"}
]
license = "MIT"
requires-python = ">=3.12,<4.0"
package-mode = false

dependencies = [
    "openai (>=3.3.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "aiosql (>=10.0,<11.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "fastapi (>=0.138.0,<0.139.0)",
    "loguru (>=0.7,<0.8)",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (>=3.2.0,<4.1.0)",
    "pydantic[dotenv,email] (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "httpx (>=0.28.1)",
    "pdfplumber (>=0.11.10)",
    "pymupdf (>=1.28.0)",
    "asyncio (>=4.0.0)",
    "pgvector (>=0.5.0)"
]

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "supplemental"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
